apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: abdvswmdr/soqonifrontend:c54a8ec
          # image: abdvswmdr/soqonifrontend:latest
          # imagePullPolicy: IfNotPresent
          imagePullPolicy: Always
          ports:
            - containerPort: 8079
          resources:
            requests:
              cpu: "100m"         # 0.1 cores reserved for scheduling
              memory: "128Mi"
            limits:
              cpu: "500m"         # avoid throttling
              memory: "256Mi"     # OOM-killed if exceed
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 8079
      targetPort: 8079
---
    
    
