apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: abdvswmdr/soqonifrontend:4f75443
          # imagePullPolicy: IfNotPresent
          imagePullPolicy: Always
          ports:
            - containerPort: 8079
          env:
            - name: AUTH_URL
              value: http://auth:8082
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: frontend-secret
                  key: session-secret
            - name: NODE_ENV
              value: production
            # COOKIE_SECURE must only be 'true' once HTTPS/cert-manager is live
            - name: COOKIE_SECURE
              value: "false"
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: frontend-kv
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 8079
      targetPort: 8079
---
    
    
